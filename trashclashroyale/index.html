<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Trash Clash Royale</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #1a1a2e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: Arial, sans-serif;
      }
      #game-container {
        display: inline-block;
        border: 2px solid #444;
        border-radius: 4px;
        overflow: hidden;
      }
      #controls {
        margin-top: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      button {
        width: 5em;
        padding: 6px 12px;
        cursor: pointer;
        border: 1px solid #555;
        border-radius: 4px;
        background: #2a2a4a;
        color: #eee;
        font-size: 14px;
      }
      button:hover:not(:disabled) { background: #3a3a6a; }
      button:disabled { opacity: 0.5; cursor: default; }
      input[type="range"] { vertical-align: middle; }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="scenarioCanvas" width="1012" height="662">
        Your browser does not support the canvas tag.
      </canvas>
    </div>
    <div id="controls">
      <button disabled="true" id="playButton">Run</button>
      <button disabled="true" id="resetButton">Reset</button>
      <input type="range" id="speedSlider" min="0" max="99" disabled="true">
    </div>

    <script src="scenario27793.js"></script>
    <script src="jszip.min.js"></script>
    <script>
      function pre_main() {
          storage_params = [];
          storage_params["storage.standalone"] = true;
          storage_params["storage.passcode"] = "0000000000000000";
          storage_params["storage.scenarioId"] = 27793;
          storage_params["storage.userId"] = -1;
          storage_params["storage.userName"] = "";

          var appletFile = "greenfoot.jar";

          var xhr = new XMLHttpRequest();
          xhr.open("GET", appletFile);
          xhr.responseType = "arraybuffer";
          xhr.onload = function() {
              JSZip.loadAsync(xhr.response).then(function (zip) {
                  window.zip = zip;
                  main();
              });
          };

          xhr.onerror = function() {
              alert("Failed to load applet.");
          };

          xhr.send();
      }
      pre_main();
    </script>
  </body>
</html>
